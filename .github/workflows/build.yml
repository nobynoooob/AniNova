name: Build Desktop Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# softprops/action-gh-release@v3 must be able to create the release and upload
# assets on the tag ref. GITHUB_TOKEN defaults to read-only in restricted
# repos, so grant explicit write access to repository contents.
permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------------
  # GUI build: pywebview desktop app for Windows + Linux.
  # Slim PyInstaller one-file build (no Playwright browser binaries) so the
  # download stays a fraction of the old 430 MB bundle. numpy/PIL/email stay
  # (package __init__ -> app -> ui.py imports them at startup).
  # -------------------------------------------------------------------------
  build-gui:
    name: build-gui (${{ matrix.os-short }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-short: windows
          - os: ubuntu-latest
            os-short: linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller "pywebview>=4.0" pythonnet

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev gir1.2-webkit2-4.1 \
            python3-gi python3-gi-cairo libgirepository-1.0-dev \
            mpv python3-pip
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller "pywebview[gtk]"

      - name: Verify WebKit introspection bindings
        if: runner.os == 'Linux'
        run: |
          python -c "import gi; gi.require_version('WebKit2', '4.1'); from gi.repository import WebKit2; print('WebKit2 4.1 OK')"

      - name: Ensure WebView2 runtime present
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # pywebview's EdgeChromium/winforms backends need the WebView2
          # runtime. GitHub windows-latest runners ship it, but install the
          # Evergreen bootstrapper as a safety net if the registry key is gone.
          $key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $present = Get-ItemProperty -Path $key -Name "pv" -ErrorAction SilentlyContinue
          if (-not $present) {
            Write-Host "WebView2 runtime missing - installing Evergreen bootstrapper"
            curl.exe -L --retry 3 --retry-delay 2 -o webview2.exe "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
            Start-Process -FilePath ".\webview2.exe" -ArgumentList "/silent", "/install" -Wait
          } else {
            Write-Host "WebView2 runtime present: $($present.pv)"
          }

      - name: Download and bundle mpv
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $urls = @()

          # 1) Resolve the latest shinchiro mpv-winbuild release asset via the
          #    GitHub API (direct download host, no SourceForge/redirects).
          try {
            $rel = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" `
              -Headers @{ "User-Agent" = "ani-cli-arabic-ci" } `
              -TimeoutSec 30
            $asset = $rel.assets | Where-Object { $_.name -match "^mpv-x86_64-v3-.*\.7z$" } | Select-Object -First 1
            if ($asset -and $asset.browser_download_url) {
              $urls += $asset.browser_download_url
            }
          } catch {
            Write-Host "GitHub API lookup failed, using pinned URLs"
          }

          # 2) Pinned fallbacks (shinchiro GitHub release, then SourceForge).
          $urls += "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260307/mpv-x86_64-v3-20260307-git-f9190e5.7z"
          $urls += "https://sourceforge.net/projects/mpv-player-windows/files/64bit/mpv-x86_64-20250119.7z/download"

          $downloaded = $false
          foreach ($url in $urls | Select-Object -Unique) {
            if (Test-Path mpv.7z) { Remove-Item mpv.7z -Force }
            Write-Host "Trying mpv URL: $url"
            curl.exe -L --retry 5 --retry-delay 3 --connect-timeout 30 --max-time 600 -o mpv.7z $url 2>$null
            if (-not (Test-Path mpv.7z)) { continue }
            $size = (Get-Item mpv.7z).Length
            if ($size -le 1MB) {
              Write-Host "Download too small ($size bytes), trying next URL"
              continue
            }
            # Verify the 7z magic bytes (37 7A BC AF 27 1C) so an HTML error
            # page never gets fed to the extractor.
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path mpv.7z))[0..5]
            $magic = ($bytes | ForEach-Object { $_.ToString("X2") }) -join ""
            if ($magic -ne "377ABCAF271C") {
              Write-Host "Not a valid 7z archive (magic=$magic), trying next URL"
              continue
            }
            Write-Host "Valid 7z downloaded ($size bytes)"
            $downloaded = $true
            break
          }

          if ($downloaded) {
            7z x mpv.7z -ompv_bundle -y | Out-Null
            $mpvExe = Get-ChildItem -Recurse -Filter "mpv.exe" -Path "mpv_bundle" | Select-Object -First 1
            if ($mpvExe) {
              New-Item -ItemType Directory -Force -Path "mpv" | Out-Null
              Copy-Item "$($mpvExe.DirectoryName)\*" -Destination "mpv/" -Recurse
              if (Test-Path "mpv/mpv.exe") {
                Write-Host "mpv bundled successfully: mpv/mpv.exe"
              } else {
                Write-Host "::error::mpv.exe missing after copy step"
                exit 1
              }
            } else {
              Write-Host "::error::archive extracted but mpv.exe not found inside"
              exit 1
            }
          } else {
            Write-Host "::warning::could not download a valid mpv archive; will build without bundled mpv"
            New-Item -ItemType Directory -Force -Path "mpv" | Out-Null
          }

      - name: Build GUI executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Slim onedir build: no --bundle-browser (Chromium is downloaded on first
        # use via ensure_playwright_chromium) and heavy unused modules are
        # excluded. numpy/PIL/email are kept: importing the package pulls in
        # app -> ui.py, which imports numpy + PIL at module load.
        # --onedir produces a standalone dist/AniNova/ folder (exe + DLLs + mpv)
        # that is zipped into a portable release below.
        run: |
          python build_desktop.py --target gui --onedir --bundle-mpv `
            --exclude-module tkinter `
            --exclude-module unittest `
            --exclude-module pydoc `
            --exclude-module PyQt6 `
            --exclude-module PySide6 `
            --exclude-module customtkinter `
            --exe-name AniNova

      - name: Package Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        # Compress the onedir folder into a single portable release asset. The
        # version comes from the git tag (e.g. v1.9.7) so the file name is
        # AniNova-v1.9.7-Windows-Portable.zip; on manual (workflow_dispatch)
        # runs it falls back to the version baked into version.py.
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -notmatch '^v\d') {
            $m = Select-String -Path "ani_cli_arabic/version.py" -Pattern '^__version__ = "([^"]+)"'
            $version = if ($m) { "v" + $m.Matches[0].Groups[1].Value } else { "v1.9.7" }
          }
          Write-Host "Packaging portable zip for $version"
          if (-not (Test-Path "dist/AniNova")) {
            Write-Host "::error::dist/AniNova folder missing"
            exit 1
          }
          Compress-Archive -Path "dist/AniNova" -DestinationPath "AniNova-$version-Windows-Portable.zip" -CompressionLevel Optimal -Force
          Get-Item "AniNova-$version-Windows-Portable.zip" | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Build GUI executable (Linux)
        if: runner.os == 'Linux'
        run: |
          python build_desktop.py --target gui \
            --exclude-module tkinter \
            --exclude-module unittest \
            --exclude-module pydoc \
            --exclude-module PyQt6 \
            --exclude-module PySide6 \
            --exclude-module customtkinter \
            --exe-name AniNova

      - name: Assemble Linux GUI bundle
        if: runner.os == 'Linux'
        # Branded as AniNova (single-file exe + desktop entry + installer).
        # The version comes from the git tag (e.g. v1.3.1) so the file name is
        # AniNova-v1.3.1-Linux.tar.gz; on manual (workflow_dispatch) runs it
        # falls back to the version baked into version.py.
        run: |
          version="${{ github.ref_name }}"
          if [[ ! "$version" =~ ^v[0-9] ]]; then
            version="v$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' ani_cli_arabic/version.py)"
          fi
          mkdir -p AniNova
          cp dist/AniNova AniNova/AniNova
          cp assets/aninova.desktop AniNova/aninova.desktop
          cp assets/icon.png AniNova/aninova.png
          cp scripts/install_linux.sh AniNova/install.sh
          chmod +x AniNova/install.sh AniNova/AniNova
          tar -czf "AniNova-$version-Linux.tar.gz" AniNova
          echo "Bundled:"
          ls -lh AniNova/ "AniNova-$version-Linux.tar.gz"

      - name: Upload GUI artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: AniNova-windows-portable
          path: |
            AniNova-*-Windows-Portable.zip

      - name: Upload GUI artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: AniNova-linux
          path: AniNova-*-Linux.tar.gz

  release:
    needs: [build-gui]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -lh artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: false
